<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" > 
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<meta http-equiv="content-language" content="en">
<meta name="author" content="bbkRClive">
<meta name="description" content="bbkRClive">
<meta name="keywords" content="">
<meta name="creation-date" content="01/12/2010">
<meta name="revisit-after" content="15 days">
<meta name="viewport" content="width=device-width; initial-scale=1.0; maximum-scale=1.0; user-scalable=0;" />
<title>FORCC Live Race Results</title>
<style type='text/css'>
  body, table {padding: 0px; margin: 0px; border: 0px; border-collapse: collapse; background:white; font: 0.8em/1.25  Arial, Helvetica, sans-serif; font-size: 10pt; }
 .local-results-frame{width: 100%; height: 450px; padding: 0px; margin: 0px; border: 0px; border-collapse: collapse;}
 .TDbtn {color: white; background-color: grey;  text-align: center; }
 .btn {cursor: pointer; font: 0.8em/1.25  Arial, Helvetica, sans-serif; font-size: 10pt; font-weight: bold; display: block;}

 .Tablebtn {background:black; width:100%; border-color:black; width:100%; border-collapse:separate;}      

 @media only screen and (min-device-width: 240px)) {
  /* 
  older PDAs 
  */
  .local-results-frame{width: 100%; height: 100%; padding: 0px; margin: 0px; border: 0px; border-collapse: collapse;}
}
 
@media only screen and (min-device-width: 320px) and (max-device-width: 480px) {
  /* 
  iPhone, Android rules here 
  */
  .local-results-frame{width: 100%; height: 100%; padding: 0px; margin: 0px; border: 0px; border-collapse: collapse; ;}
  .TDbtn {padding: 5 0 5 0; }
  .btn {font-size: 12pt;}
}
  
</style>
</head>

   
   
<body>
  <table style="width:100%"><tr>
  
 <td style='width:25%' align='left' valign='bottom'>
    <table><tr>
    <td>
    <input type='image' 
       src='back_icon.png'
       alt='Back' 
       title='Back' 
	 height='40'
       onclick="document.getElementById('local-resultsframe').contentWindow.history.go(-1);">
    </td>
    <td>
    <input type="image" 
       src="refresh_icon.jpg"
       alt='Refresh' 
       title='Refresh' 
 	 height='40'
       onclick="document.getElementById('local-resultsframe').contentWindow.location.reload(true);">
    </td>
    <td>
    <input type="image" 
       src="home_icon.jpg" 
       alt='Goto Index'
       title='Goto Index'
	 height='40'
       onclick="document.getElementById('local-resultsframe').src='liveindex.htm'">
    </td>
    </tr></table>
  </td>

  <td style='width:50%;' align='center' valign='bottom'>
    <table><tr>  
    	<td>
    	<!--[if IE]>
    	<img src='FORCC Logo.png' width='130' border='0'>
    	<![endif]--> 
    	<!--[if !IE]>--> 
    	<img src='FORCC%20Logo.png' width='140' border='0'> 
    	<!--<![endif]--> 
    	</td>
     </tr></table>  
   </td>

 <td style='width:25%;' align='right' valign='bottom'>
    <table><tr>  
    <td>
    <input type="image" 
       src="help_icon.jpg" 
       alt='Help'
       title='Help'
	 height='40'
       onclick="document.getElementById('local-resultsframe').src='help.html'">
    </td>    
    </tr></table>
  </td>
  </tr></table>  
    
    <table class=Tablebtn><tr>
    <td class=TDbtn>
    <a class=btn 
      title="Live Race" 
      onclick= "document.getElementById('local-resultsframe').src='liveraceres.htm'">
      Live Race
    </a> 
    </td>
    
    <td class=TDbtn>
    <a class=btn 
      title="Results Index" 
      onclick= "document.getElementById('local-resultsframe').src='liveresults.htm'">
      Results
    </a>
    </td>
    <td class=TDbtn>
    <a class=btn 
      title="Race Schedule" 
      onclick= "document.getElementById('local-resultsframe').src='liveschedule.htm'">
      Schedule
    </a>
    </td>
    <td class=TDbtn>
    <a class=btn 
      title="List of Drivers" 
      onclick= "document.getElementById('local-resultsframe').src='livecompets.htm'">
      Drivers
    </a>
    </td>
    
    </tr>
    </table>
    

    <iframe class = 'local-results-frame' 
            id='local-resultsframe'
            src='liveindex.htm'>
    </iframe>
</body>
</html>
