<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" > 
<html>
<head>

<title>Live Race Data from bbkRC Drivers Plus</title>
<style type='text/css'>
  body, table {padding: 0px; margin: 0px; border: 0px; border-collapse: collapse; background:black; font: 0.8em/1.25  Arial, Helvetica, sans-serif; font-size: 10pt; }
 .local-results-frame{width: 100%; height: 450px; padding: 0px; margin: 0px; border: 0px; border-collapse: collapse;}
 .TDbtn {color: white; background-color: blue;  text-align: center; }
 .btn {cursor: pointer; font: 0.8em/1.25  Arial, Helvetica, sans-serif; font-size: 10pt; font-weight: bold; display: block;}

 .Tablebtn {background:white; width:100%; border-color:white; width:100%; border-collapse:separate;}      

 @media only screen and (min-device-width: 240px)) {
  /* 
  older PDAs 
  */
  .local-results-frame{width: 100%; height: 100%; padding: 0px; margin: 0px; border: 0px; border-collapse: collapse;}
}
 
@media only screen and (min-device-width: 320px) and (max-device-width: 480px) {
  /* 
  iPhone, Android rules here 
  */
  .local-results-frame{width: 100%; height: 100%; padding: 0px; margin: 0px; border: 0px; border-collapse: collapse; ;}
  .TDbtn {padding: 5 0 5 0; }
  .btn {font-size: 12pt;}
}
  
</style>
</head>

   
   
<body>
  <table style="width:100%"><tr>
  <td style='width:50%' align='left'>
    <table><tr>
    <td>
    <input type='image' 
       src='back.gif'
       alt='Back' 
       title='Back' 
       onclick="document.getElementById('local-resultsframe').contentWindow.history.go(-1);">
    </td><td>
    <input type="image" 
       src="refresh.gif"
       alt='Refresh' 
       title='Refresh' 
       onclick="document.getElementById('local-resultsframe').contentWindow.location.reload(true);">
    </td><td>
    <input type="image" 
       src="home1.gif" 
       alt='Goto Index'
       title='Goto Index'
       onclick="document.getElementById('local-resultsframe').src='liveindex.htm'">
    </td>
    </tr></table>
  </td>
  <td style='width:50%;' align='right'>
    <table><tr>  
    <td>
    <!--[if IE]>
    <img src='bbkRClive.png' width='130' border='0'>
    <![endif]--> 
    <!--[if !IE]>--> 
    <img src='bbkRClive.png' width='140' border='0'> 
    <!--<![endif]--> 
    </td>
    <td>
    <input type="image" 
       src="help.png" 
       alt='Help'
       title='Help'
       onclick="document.getElementById('local-resultsframe').src='help.html'">
    </td>    
    </tr></table>
  </td>
  </tr></table>  
    
    <table class=Tablebtn><tr>
    <td class=TDbtn>
    <a class=btn 
      title="Live Race" 
      onclick= "document.getElementById('local-resultsframe').src='liveraceres.htm'">
      Live Race
    </a> 
    </td>
    
    <td class=TDbtn>
    <a class=btn 
      title="Results Index" 
      onclick= "document.getElementById('local-resultsframe').src='liveresults.htm'">
      Results
    </a>
    </td>
    <td class=TDbtn>
    <a class=btn 
      title="Race Schedule" 
      onclick= "document.getElementById('local-resultsframe').src='liveschedule.htm'">
      Schedule
    </a>
    </td>
    <td class=TDbtn>
    <a class=btn 
      title="List of Drivers" 
      onclick= "document.getElementById('local-resultsframe').src='livecompets.htm'">
      Drivers
    </a>
    </td>
    
    </tr>
    </table>
    

    <iframe class = 'local-results-frame' 
            id='local-resultsframe'
            src='liveindex.htm'>
    </iframe>
